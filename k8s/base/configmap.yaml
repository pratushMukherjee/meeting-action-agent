apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-agent-config
  labels:
    app: meeting-agent
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_RETRIES: "3"
  MAX_AGENT_STEPS: "20"
  CONFIDENCE_THRESHOLD: "0.7"
  MAX_TOKEN_BUDGET: "10000"
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "meeting-action-agent"
