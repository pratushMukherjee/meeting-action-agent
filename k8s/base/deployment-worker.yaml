apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-agent-worker
  labels:
    app: meeting-agent
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: meeting-agent
      component: worker
  template:
    metadata:
      labels:
        app: meeting-agent
        component: worker
    spec:
      containers:
        - name: worker
          image: meeting-action-agent-worker:latest
          envFrom:
            - configMapRef:
                name: meeting-agent-config
            - secretRef:
                name: meeting-agent-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
