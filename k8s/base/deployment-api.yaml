apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-agent-api
  labels:
    app: meeting-agent
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meeting-agent
      component: api
  template:
    metadata:
      labels:
        app: meeting-agent
        component: api
    spec:
      containers:
        - name: api
          image: meeting-action-agent-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: meeting-agent-config
            - secretRef:
                name: meeting-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
